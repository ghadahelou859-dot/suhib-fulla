<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <title>دعوة زفاف صهيب وفلة</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="musicBtn" class="music-btn" aria-label="تشغيل أو إيقاف الموسيقى">🔊</button>
  <audio id="music" src="music.mp3" loop preload="auto"></audio>

  <section id="cover" class="screen active cover-screen">
    <img src="envelope.png" alt="مغلف الدعوة" />
    <button id="openBtn" class="open-btn">افتح الدعوة</button>
  </section>

  <section id="intro" class="screen intro-screen">
    <video id="introVideo" playsinline webkit-playsinline muted preload="auto"></video>
  </section>

  <main id="pages" class="screen pages">
    <section class="page image-page"><img src="save.jpg" alt="Save the Date" /></section>
    <section class="page image-page"><img src="info.jpg" alt="معلومات حفل الزفاف" /></section>
    <section class="page image-page"><img src="henna.jpg" alt="دعوة الحنة" /></section>

    <section class="page image-page countdown-page">
      <img src="countdown.jpg" alt="العد التنازلي" />
      <div class="countdown" aria-label="العد التنازلي لحفل الزفاف">
        <div><b id="days">0</b><span>يوم</span></div>
        <div><b id="hours">00</b><span>ساعة</span></div>
        <div><b id="minutes">00</b><span>دقيقة</span></div>
        <div><b id="seconds">00</b><span>ثانية</span></div>
      </div>
    </section>

    <section class="page image-page location-page">
      <img src="location.jpg" alt="قاعة الريال الملكية - أبو ديس" />
      <a class="transparent-map-btn" href="https://maps.app.goo.gl/o7Q5VmzdWNoJEJsk9" target="_blank" rel="noopener" aria-label="افتح الموقع على الخريطة"></a>
    </section>

    <section class="page final-page">
      <img src="final-bg.jpg" alt="" class="final-bg" />
      <div class="final-content">
        <p class="small-title">صهيب &amp; فلة</p>
        <h2>بحضوركم تكتمل فرحتنا</h2>
        <p>نسعد بمشاركتكم أجمل لحظاتنا</p>
        <button id="rsvpBtn" class="gold-btn">تأكيد الحضور</button>
        <div class="socials">
          <a href="https://www.instagram.com/ghada.invitations?igsi=dndkd3lhMmJ0M2E5&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.tiktok.com/@ghada.invitations?_r=1&_t=ZS-99Ru8uGvd10" target="_blank" rel="noopener">TikTok</a>
          <a href="https://snapchat.com/t/n8AEKXRm" target="_blank" rel="noopener">Snapchat</a>
        </div>
      </div>
    </section>
  </main>

  <div id="rsvpModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closeRsvp" class="close-btn" aria-label="إغلاق">×</button>
      <h3>تأكيد الحضور</h3>
      <label>الاسم<input id="guestName" type="text" placeholder="اكتب الاسم" /></label>
      <label>عدد الحضور
        <select id="guestCount">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
        </select>
      </label>
      <div class="attendance">
        <label><input type="radio" name="attendance" value="سأحضر" checked /> سأحضر</label>
        <label><input type="radio" name="attendance" value="أعتذر عن الحضور" /> أعتذر</label>
      </div>
      <button id="sendRsvp" class="gold-btn full">إرسال عبر واتساب</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
